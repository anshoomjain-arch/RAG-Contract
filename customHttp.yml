# Security headers for the static site on Amplify Hosting (Phase 8). connect-src allows only the API (HTTP API
# Gateway), the streaming chat (Lambda Function URL) and S3 (presigned upload and PDF links) in ap-southeast-2.
# 'unsafe-inline' for scripts is required by Next.js static export (inline bootstrap scripts, no nonce without a
# server). Tested with web/e2e/full-flow.mjs against the same policy (scripts/serve_static.py).
customHeaders:
  - pattern: "**/*"
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - key: Content-Security-Policy
        value: >-
          default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:;
          connect-src 'self' https://*.execute-api.ap-southeast-2.amazonaws.com https://*.lambda-url.ap-southeast-2.on.aws
          https://*.s3.amazonaws.com https://*.s3.ap-southeast-2.amazonaws.com;
          frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'
  - pattern: "**/*.mjs"
    headers:
      # The PDF.js worker is an ES module: browsers refuse module scripts served as text/plain or octet-stream.
      - key: Content-Type
        value: text/javascript